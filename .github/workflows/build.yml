name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build lightweight APK (arm64 only)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bothie-predictions-apk

          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
